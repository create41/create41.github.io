name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A3715C: ${{ secrets.A3715C }}
          BAD2C0: ${{ secrets.BAD2C0 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('A3715C', ''), os.environ.get('BAD2C0', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- e59297cc331f24b2d77c59298b -->', a)
          if b:
              patched = patched.replace('<!-- 3951e43ca62ceec0a5da496ac1f66b24 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
